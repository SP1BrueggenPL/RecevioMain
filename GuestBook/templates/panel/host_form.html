{% extends "base_panel.html" %}
{% block content %}
<section class="intro-single">
  <div class="container">
    <div class="row">
      <div class="col-lg-6">
        <div class="title-single-box">
          <br><br><br>
          <h1 class="title-single">
            {% if host %}Edit Host{% else %}Add Host{% endif %}
          </h1>
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Host Name</label>
              <input type="text" name="host_name" class="form-control" value="{{ host.host_name|default_if_none:'' }}" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Phone</label>
              <input type="text" name="phone" class="form-control" value="{{ host.phone|default_if_none:'' }}">
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" value="{{ host.email|default_if_none:'' }}" placeholder="host@example.com">
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'hosts' %}" class="btn btn-secondary">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

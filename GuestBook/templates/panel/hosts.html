{% extends "base_panel.html" %}
{% block content %}
<section class="intro-single">
  <div class="container">
    <div class="row">
      <div class="col-lg-10">
        <div class="title-single-box">
          <br><br><br>
          <h1 class="title-single">Hosts</h1>

          <form method="get" class="d-flex mb-3">
            <input type="text" name="q" class="form-control me-2" placeholder="Search host or phone" value="{{ query }}">
            <button class="btn btn-primary" type="submit">Search</button>
            <a href="{% url 'host_import' %}" class="btn btn-secondary ms-2">Import Excel</a>
            <a href="{% url 'host_add' %}" class="btn btn-success ms-2">+ Add Host</a>
          </form>

          <table class="table table-striped table-hover">
            <thead class="table-dark">
              <tr>
                <th>#</th>
                <th>Host Name</th>
                <th>Phone</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              {% for host in hosts %}
                <tr>
                  <td>{{ forloop.counter }}</td>
                  <td>{{ host.host_name }}</td>
                  <td>{{ host.phone|default:"-" }}</td>
                  <td>
                    <a href="{% url 'host_edit' host.id %}" class="btn btn-sm btn-primary">Edit</a>
                    <a href="{% url 'host_delete' host.id %}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Are you sure you want to delete this host?')">Delete</a>
                  </td>
                </tr>
              {% empty %}
                <tr>
                  <td colspan="4" class="text-center text-muted">No hosts found</td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

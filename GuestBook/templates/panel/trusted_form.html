{% extends "base_panel.html" %}
{% block content %}
<section class="intro-single">
  <div class="container">
    <div class="row">
      <div class="col-lg-8">
        <div class="title-single-box">
          <br><br><br>
          <h1 class="title-single">
            {% if trusted %}Edit Trusted Visitor{% else %}Add Trusted Visitor{% endif %}
          </h1>
          <form method="post">
            {% csrf_token %}
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">First Name</label>
                <input type="text" name="first_name" class="form-control" value="{{ trusted.first_name|default_if_none:'' }}" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Last Name</label>
                <input type="text" name="last_name" class="form-control" value="{{ trusted.last_name|default_if_none:'' }}" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Phone</label>
                <input type="text" name="phone" class="form-control" value="{{ trusted.phone|default_if_none:'' }}">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Company</label>
                <input type="text" name="company" class="form-control" value="{{ trusted.company|default_if_none:'' }}">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Visit Purpose</label>
                <input type="text" name="visit_purpose" class="form-control" value="{{ trusted.visit_purpose|default_if_none:'' }}">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Host Name</label>
                <input type="text" name="host_name" class="form-control" value="{{ trusted.host_name|default_if_none:'' }}">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Host Phone</label>
                <input type="text" name="host_phone" class="form-control" value="{{ trusted.host_phone|default_if_none:'' }}">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Language</label>
                <select name="language" class="form-select">
                  <option value="pl" {% if trusted.language == 'pl' %}selected{% endif %}>Polish</option>
                  <option value="en" {% if trusted.language == 'en' %}selected{% endif %}>English</option>
                </select>
              </div>
              <div class="col-md-6 mb-3 form-check">
                <input type="checkbox" class="form-check-input" name="production_area" {% if trusted.production_area %}checked{% endif %}>
                <label class="form-check-label">Production Area</label>
              </div>
              <div class="col-md-6 mb-3 form-check">
                <input type="checkbox" class="form-check-input" name="with_supervision" {% if trusted.with_supervision %}checked{% endif %}>
                <label class="form-check-label">With Supervision</label>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Badge ID</label>
                <input type="text" name="badge_id" class="form-control" value="{{ trusted.badge_id|default_if_none:'' }}" required>
              </div>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a href="{% url 'trusted' %}" class="btn btn-secondary">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}

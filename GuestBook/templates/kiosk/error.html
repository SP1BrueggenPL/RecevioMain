{% extends "base_kiosk.html" %}
{% load i18n %}

{% block content %}
<div style="text-align: center; margin-top: 12rem; max-width: 1200px; margin-left: auto; margin-right: auto; padding: 2rem;">
  <h1 style="color: red; font-size: 3rem; margin-bottom: 2rem; white-space: nowrap;">
    {% trans "An unexpected error has occurred" %}
  </h1>
  <p style="font-size: 2rem; color: #514b51; margin-bottom: 1.5rem;">
    {{ message }}
  </p>
  <p style="margin-top: 2rem; font-style: italic; font-size: 1.8rem; color: #514b51;">
    {% trans "You will be redirected to the start screen in a moment..." %}
  </p>

  <div style="margin-top: 3rem;">
    <a href="{% url 'start' %}"
       style="
         display: inline-block;
         width: 300px;
         height: 100px;
         line-height: 100px;
         font-size: 2rem;
         background-color: #514b51;
         color: white;
         text-decoration: none;
         border-radius: 12px;
         box-shadow: 0 4px 8px rgba(0,0,0,0.2);
       ">
      {% trans "Back to Start" %}
    </a>
  </div>
</div>

<script>
  setTimeout(function() {
    window.location.href = "{% url 'start' %}";
  }, 60000); // 60 sekund
</script>
{% endblock %}

{% extends "base_kiosk.html" %}
{% load i18n %}

{% block content %}
<div class="container text-center mt-5" style="max-width: 900px; margin: auto; padding: 3rem;">

  <!-- Duży nagłówek -->
  <h2 class="mb-5" style="font-size: 3rem; font-weight: bold;">
    {% trans "Please scan your badge" %}
  </h2>

  <!-- Formularz ukryty (obsługiwany przez skaner) -->
  <form method="post" id="badgeForm" style="display: none;">
    {% csrf_token %}
    <input type="hidden" name="badge_id" id="badgeInput">
  </form>

  <!-- Status -->
  <div id="status" class="mt-4 text-muted"
       style="font-size: 2rem; color: #514b51; font-weight: 500;">
    {% trans "Waiting for the badge to be scanned..." %}
  </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  let buffer = "";

  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      e.preventDefault();

      if (buffer.length > 0) {
        document.getElementById("badgeInput").value = buffer;
        document.getElementById("badgeForm").submit();
        document.getElementById("status").innerText = "{{ _('Processing...') }}";
        buffer = "";
      }
    } else {
      if (e.key.length === 1) {
        buffer += e.key;
      }
    }
  });
});
</script>
{% endblock %}

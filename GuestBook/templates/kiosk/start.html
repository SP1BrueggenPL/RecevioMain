{% extends "base_kioskb.html" %}
{% load i18n static %}

{% block content %}
<style>
  body {
    background: url("{% static 'backgrounds/start_bg.png' %}") no-repeat center center fixed;
    background-size: cover;
  }
  #confirm-guest-btn {
    position: fixed;
    bottom: 18px;
    right: 18px;
    background: rgba(0,0,0,0.5);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 1rem;
    cursor: pointer;
    z-index: 1000;
  }
</style>

<div style="width: 500px; margin: auto; padding: 3rem; text-align: center; background-color: rgba(255, 255, 255, 0.85); border-radius: 15px;">
  <form method="get" action="{% url 'choose_language' %}">
    <button type="submit"
      style="
        background-color: #ff4143;
        color: white;
        padding: 2rem;
        border: none;
        border-radius: 15px;
        font-size: 2.5rem;
        font-weight: bold;
        margin-top: 2rem;
        width: 400px;
        height: 120px;
        cursor: pointer;
        box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      ">
      START
    </button>
  </form>
</div>

<!-- Confirm guest button -->
<a id="confirm-guest-btn" href="{% url 'confirm_guest_list' %}">
  {% trans "Confirm guest" %}
</a>
{% endblock %}

{% extends "base_panel.html" %}
{% block content %}
<br><br><br>
<div class="container">
  <h1 class="title-single mb-3">Senders</h1>

  <div class="row g-3">
    <!-- Formularz dodawania -->
    <div class="col-lg-5">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white fw-semibold">Add sender</div>
        <div class="card-body">
          <form method="post" class="row g-2" autocomplete="off">
            {% csrf_token %}
            <input type="hidden" name="action" value="create">
            <div class="col-12">
              <label class="form-label">Name</label>
              {{ form.name }}
            </div>
            <div class="col-12 d-flex gap-2 mt-2">
              <button class="btn btn-primary">Add</button>
              <a class="btn btn-outline-secondary" href="{% url 'helpdesk_import_senders' %}">
                Import from file
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Lista z edycją -->
    <div class="col-lg-7">
      <div class="card shadow-sm border-0">
        <div class="card-header bg-light fw-semibold">Senders list</div>
        <ul class="list-group list-group-flush">
          {% for s in items %}
            <li class="list-group-item">
              <div class="d-flex justify-content-between align-items-center">
                <div class="fw-semibold">{{ s.name }}</div>
                <button class="btn btn-sm btn-outline-secondary" type="button"
                        data-bs-toggle="collapse" data-bs-target="#snd-{{ s.id }}">
                  Edit
                </button>
              </div>

              <div class="collapse mt-3" id="snd-{{ s.id }}">
                <form method="post" class="row g-2" autocomplete="off">
                  {% csrf_token %}
                  <input type="hidden" name="action" value="update">
                  <input type="hidden" name="sender_id" value="{{ s.id }}">
                  <div class="col-md-8">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-control" value="{{ s.name }}">
                  </div>
                  <div class="col-12 d-flex gap-2">
                    <button class="btn btn-success">Save</button>
                    <button class="btn btn-outline-secondary" type="button"
                            data-bs-toggle="collapse" data-bs-target="#snd-{{ s.id }}">
                      Cancel
                    </button>
                  </div>
                </form>
              </div>
            </li>
          {% empty %}
            <li class="list-group-item text-muted">No entries</li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('form .form-control, form input, form select').forEach(el => {
      if (!el.classList.contains('form-control') && el.tagName === 'INPUT') el.classList.add('form-control');
      if (el.tagName === 'SELECT') el.classList.add('form-select');
    });
  });
</script>
{% endblock %}

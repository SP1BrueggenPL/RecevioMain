<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<style>
  @page { size: 65mm 40mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 65mm; height: 40mm;
    font-family: Arial, sans-serif;
    padding: 2mm 3mm;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .code {
    font-size: 15pt; font-weight: 900; letter-spacing: 1px; text-align: center;
    border-bottom: 1px solid #000; padding-bottom: 1mm;
  }
  .row { font-size: 7.5pt; margin-top: 1.2mm; line-height: 1.25; }
  .row strong { display: inline-block; width: 18mm; font-weight: 700; }
  .footer { font-size: 6pt; color: #666; text-align: right; }
</style>
</head>
<body>
  <div class="code">{{ pkg.code }}</div>
  <div>
    <div class="row"><strong>Nadawca:</strong> {{ pkg.sender }}</div>
    <div class="row"><strong>Odbiorca:</strong> {{ pkg.recipient }}</div>
    <div class="row"><strong>Data:</strong> {{ pkg.delivered_at|date:"d.m.Y, H:i" }}</div>
  </div>
  <div class="footer">Recevio BoxFlow</div>
<script>window.onload = function() { window.print(); };</script>
</body>
</html>

{% load static i18n %}
{% get_current_language as LANGUAGE %}
<html lang="{{ LANGUAGE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GuestBook</title>
    <link href="{% static 'css/kiosk.css' %}" rel="stylesheet">
<style>
    body { opacity: 0; transition: opacity 0.6s ease-in-out; }
    body.fade-in { opacity: 1; }

    .back-button {
        position: fixed; bottom: 30px; left: 30px;
        width: 200px; height: 70px; font-size: 1.8rem;
        background-color: #514b51; color: white; border: none; border-radius: 12px;
        cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.2); z-index: 9999;
    }
    .back-button:hover { background-color: #3e3a3e; }
</style>
</head>
<body>

{% block content %}{% endblock %}

<button class="back-button" onclick="history.back()">⬅ {% trans "Back" %}</button>

<script>
document.addEventListener('DOMContentLoaded', function () {
  document.body.classList.add('fade-in');
});
</script>

{% include 'kiosk/_virtual_keyboard.html' %}

</body>
</html>
